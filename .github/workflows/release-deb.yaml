name: Release .deb
run-name: .deb packages (${{ github.ref_name }})
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-deb:
    name: ${{ matrix.name }} 🐧
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Ubuntu 22.04, image: 'ubuntu:22.04', id: ubuntu-22.04}
          - {name: Ubuntu 24.04, image: 'ubuntu:24.04', id: ubuntu-24.04}
          - {name: Ubuntu 26.04, image: 'ubuntu:26.04', id: ubuntu-26.04}
          # Devuan Daedalus = Debian 12; Devuan Excalibur = Debian 13
          - {name: Debian 12 (Devuan Daedalus), image: 'debian:12', id: debian-12}
          - {name: Debian 13 (Devuan Excalibur), image: 'debian:13', id: debian-13}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install base tools 🛍️
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git curl jq xz-utils build-essential cmake ninja-build \
            pkg-config lsb-release file ccache

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Install dependencies 🛍️
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libjansson-dev libx11-xcb-dev libwayland-dev libpipewire-0.3-dev libpulse-dev \
            libx264-dev libmbedtls-dev libgl1-mesa-dev libglvnd-dev libegl-dev libgles-dev \
            libluajit-5.1-dev python3-dev swig libcmocka-dev \
            libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxss-dev \
            libxkbcommon-dev libasound2-dev  libfontconfig-dev libfreetype6-dev \
            libjack-jackd2-dev libsndio-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev \
            libvlc-dev libpci-dev libdrm-dev \
            libnss3-dev libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libxfixes-dev libxext-dev \
            libgbm-dev libcups2-dev libpango1.0-dev libcairo2-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev
          # Opcionais: não existem em todas as versões (o OBS desliga o recurso se faltar)
          # libfdk-aac-dev fica em non-free no Debian
          for p in libvpl-dev libvpl2 libfdk-aac-dev libqrcodegencpp-dev librist-dev libsrt-openssl-dev; do
            apt-get install -y --no-install-recommends "$p" || echo "::warning::pacote opcional indisponível: $p"
          done

      - name: Download CEF 🌐
        run: |
          set -e
          ver=$(jq -r '.dependencies.cef.version' buildspec.json)
          base=$(jq -r '.dependencies.cef.baseUrl' buildspec.json)
          hash=$(jq -r '.dependencies.cef.hashes["linux-x86_64"]' buildspec.json)
          rev=$(jq -r '.dependencies.cef.revision["linux-x86_64"] // empty' buildspec.json)
          file="cef_binary_${ver}_linux_x86_64${rev:+_v$rev}.tar.xz"
          mkdir -p .deps/cef && cd .deps
          curl -fsSL -O "$base/$file"
          echo "$hash  $file" | sha256sum -c -
          tar --strip-components 1 -C cef -xJf "$file"

      - name: Configure ⚙️
        shell: bash
        run: |
          extra=""
          # Sem librist/srt (Ubuntu 22.04) o novo output mpegts não compila
          if [ "$(lsb_release -is)-$(lsb_release -rs)" = "Ubuntu-22.04" ]; then
            extra="-DENABLE_NEW_MPEGTS_OUTPUT=OFF"
          fi
          # O fork não tem as tags do upstream: define a versão explicitamente
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            ver="${BASH_REMATCH[1]}"
          else
            ver="30.1.2-git${GITHUB_SHA::8}"
          fi
          echo "OBS_VERSION_OVERRIDE=$ver"
          cmake -S . -B build -G Ninja \
            -DOBS_VERSION_OVERRIDE="$ver" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCEF_ROOT_DIR="$PWD/.deps/cef" \
            -DENABLE_BROWSER=ON \
            -DCMAKE_C_FLAGS="-Wno-error=deprecated-declarations" \
            -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-declarations" \
            -DENABLE_AJA=OFF -DENABLE_WEBRTC=OFF \
            $extra

      - name: Build 🧱
        run: cmake --build build --parallel

      - name: Package 📦
        run: |
          cmake --build build -t package
          cd build
          rel="${{ matrix.id }}"
          for f in obs-studio-*.deb obs-studio-*.ddeb; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.*}-${rel}.${f##*.}"
          done
          ls -l *.deb *.ddeb 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.id }}
          path: |
            build/*.deb
            build/*.ddeb

  release:
    name: Publish release 🚀
    if: github.ref_type == 'tag' && !cancelled()
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l debs
          gh release create "${{ github.ref_name }}" debs/*.deb debs/*.ddeb \
            --title "${{ github.ref_name }}" --generate-notes --prerelease
